plugins {
    id 'java'
    id 'io.qameta.allure' version '4.3.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // keep in sync with the Selenium Grid version in docker-compose
    implementation group: 'org.seleniumhq.selenium', name: 'selenium-java', version: '4.49.0'
    implementation group: 'org.testng', name: 'testng', version: '7.12.0'

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

    implementation 'net.datafaker:datafaker:2.7.0'
    implementation 'ch.qos.logback:logback-classic:1.5.18'

    // Allure: TestNG listener writes results to build/allure-results; Allure API for screenshots in TestNGListener
    implementation 'io.qameta.allure:allure-testng:2.35.5'
}

// Allure report: .\gradlew allureServe (opens in browser) or .\gradlew allureReport
// (build/reports/allure-report/allureReport/index.html). Run tests first.
allure {
    version = '2.46.1'              // Allure 2 report (Java, no Node.js needed)
    adapter {
        allureJavaVersion = '2.35.5'
        aspectjVersion = '1.9.25'
        aspectjWeaver = true        // for @Step and @Attachment
        autoconfigure = true
    }
}

// settings passed to tests from the command line, e.g.
// .\gradlew crossbrowser -DgridUrl=http://localhost:4444
def configKeys = ['browser', 'gridUrl', 'baseUrl', 'headless', 'login', 'password']

tasks.withType(Test).configureEach {
    configKeys.each { key ->
        def value = System.getProperty(key)
        if (value != null) {
            systemProperty key, value
        }
    }
    // UI tests depend on the site, not only on the code: always run them
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

test {
    // all test classes at the same time (inside a class tests run one by one)
    useTestNG {
        parallel = 'classes'
        threadCount = 5
    }
}

tasks.register('smoketests', Test) {
    useTestNG() {
        suites 'src/test/resources/smoketests.xml'
    }
}

tasks.register('regressiontests', Test) {
    useTestNG() {
        suites 'src/test/resources/regressiontests.xml'
    }
}

tasks.register('crossbrowser', Test) {
    useTestNG() {
        suites 'src/test/resources/crossbrowser.xml'
    }
}

tasks.register('crossbrowser_regression', Test) {
    useTestNG() {
        suites 'src/test/resources/crossbrowser_regression.xml'
    }
}
