# Selenium Grid: hub + one node per browser (1 slot each).
# Image versions must match selenium-java in build.gradle.
#
# Start:   docker compose up -d
# Status:  docker compose ps        Grid UI: http://localhost:4444/ui/  (with the slash at the end)
# Logs:    docker compose logs -f
# Stop:    docker compose down
#
# Port 4444 is published on 127.0.0.1 only: the grid has no password, so it must not be reachable
# from the internet. From another computer connect through an SSH tunnel:
#   ssh -N -L 4444:localhost:4444 root@<server-ip>
# and run tests with "-DgridUrl=http://localhost:4444".

services:
  selenium-hub:
    image: selenium/hub:4.49.0
    container_name: selenium-hub
    ports:
      - "127.0.0.1:4444:4444"
    restart: unless-stopped

  chrome:
    image: selenium/node-chrome:4.49.0
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=1
    restart: unless-stopped

  firefox:
    image: selenium/node-firefox:4.49.0
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=1
    restart: unless-stopped

  edge:
    image: selenium/node-edge:4.49.0
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=1
    restart: unless-stopped
